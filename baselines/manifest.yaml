# Baseline registry. Restricted YAML subset parsed by _manifest.py (no PyYAML dep).
# `ddp_mode` is required on every entry. For `pytorch_import_adapter` entries the
# `ddp_smoke_command` field is illustrative only: the live command is built by
# `ddp_smoke_baselines.command_for()` and runs under each entry's `ddp_env`
# (default `opgbaselines`). For `local_script`/`native_torchrun` entries the
# `ddp_smoke_command` is the verbatim command that is executed.
baselines:
  - id: "active-revdeq-parcae"
    kind: "active_baseline"
    title: "Parameter Golf active RevDEQ + Parcae baseline"
    paper_url: "local:opg_doc.tex"
    code_url: "local:train_gpt.py"
    commit: "local"
    license: "repo LICENSE"
    framework: "pytorch"
    status: "adapted_eval_run"
    ddp_mode: "local_script"
    ddp_env: "opg"
    ddp_imports: "train_gpt"
    ddp_required_gpus: "2"
    replication_command: "Extract metrics from experiments/training_logs/baseline.log"
    ddp_smoke_command: "conda run --no-capture-output -n opg torchrun --standalone --nproc_per_node=2 train_gpt.py --iterations=10 --max-training-seconds=0 --val-loss-every=0 --eval-profile=debug --final-full-validation=0"
    notes: "Current Hyperparameters comparator: 12-layer shared RevDEQ-style block, Parcae per-dim damping, K-jitter 16/24/32/64/96/128, recursive prefix anchors."
